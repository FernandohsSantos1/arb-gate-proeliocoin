<svg xmlns="http://www.w3.org/2000/svg" width="240" height="56" viewBox="0 0 240 56" role="img" aria-labelledby="logo-title">
	<title id="logo-title">ClickVerso - Cartão de Crédito</title>
	<!-- For light backgrounds. Use logo.svg on dark backgrounds. -->
	<defs>
		<linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#6366F1" />
			<stop offset="1" stop-color="#7C3AED" />
		</linearGradient>
	</defs>
	<g transform="translate(14 9)">
		<!-- Back card: gold, tilted (suggests "multiple card options") -->
		<rect x="10" y="0" width="40" height="27" rx="5" fill="#F5B700" transform="rotate(-12 30 13.5)" />
		<!-- Front card -->
		<rect x="0" y="9" width="44" height="29" rx="5" fill="url(#card)" />
		<rect x="0" y="9" width="44" height="29" rx="5" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" />
		<!-- Chip -->
		<rect x="6" y="16" width="10" height="8" rx="1.8" fill="#FFD95A" />
		<path d="M6 20h10M11 16v8" stroke="#B88A00" stroke-width="0.7" />
		<!-- Contactless waves -->
		<path d="M22 17.5a4 4 0 0 1 0 5M25 15.5a7 7 0 0 1 0 9M28 13.5a10 10 0 0 1 0 13" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.9" />
		<!-- Number -->
		<rect x="6" y="30" width="22" height="2.6" rx="1.3" fill="#FFFFFF" fill-opacity="0.75" />
	</g>
	<text x="72" y="36" font-family="'Ubuntu Sans', 'Segoe UI', Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="-0.3" textLength="150" lengthAdjust="spacingAndGlyphs"><tspan fill="#1E1B4B">Click</tspan><tspan fill="#A16207">Verso</tspan></text>
</svg>
