<!DOCTYPE html>
<html lang="{{lang}}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0 shrink-to-fit=no">
    <title>{{seo_title}}</title>
    <link rel="canonical" href="{{seo_url}}">
    <meta name="description" content="{{seo_description}}">
    <meta property="og:title" content="{{seo_title}}">
    <meta property="og:description" content="{{seo_description}}">
    <meta property="og:image" content="{{seo_image}}">
    <meta property="og:url" content="{{seo_url}}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="{{lang}}">
    <link rel="stylesheet" href="/public/css/index.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Muli:ital,wght@0,400;0,700;1,400;1,700&family=Roboto:wght@400;700&display=swap">
	<script src="/public/js/main.js" defer></script>
</head>
<body>
<div class="site-wrap">
    <header class="site-header">
        <div class="header-middle">
            <div class="container">
                <div class="">
                    <div class="">
                        <a class="menu-icon nav-icon custom-header" id="js-menu-toggle" href="javascript:;">
                            <span class="line"></span>
                            <span class="line"></span>
                            <span class="line"></span>
                        </a>
                        <div class="logo">
                            <a href="{{home_url}}" class="logo-image theme-light-logo">
                                <img src="/public/img/logo.svg" style="height: 50px;">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="header-bottom">
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="nav-bar flex">
                            <nav class="nav-left">
                                <ul class="nav-list nav-list-primary text-upper no-style-list">
                                    {{menu}}
                                </ul>
                            </nav>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="mobile-nav-wrap" id="mobile-nav">
            <ul class="no-style-list mobile-nav">
                {{menu}}
            </ul>
        </div>
    </header>
