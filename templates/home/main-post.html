<article class="featured-article">
    <a href="{url}">
        <div class="featured-image">
            <div class="image-container">
                <img src="{featured_image}" alt="{title}" loading="lazy">
            </div>
        </div>
        <div class="featured-info">
            <h2>
                {title}
            </h2>
        </div>
    </a>
</article>
