<li>
    <div class="image-container">
        <a href="{url}">
            <img src="{featured_image}" alt="{title}" loading="lazy">
        </a>
    </div>
    <div>
        <h3>
            <a href="{url}">{title}</a>
        </h3>
        <time datetime="{isodate}">{date}</time>
        <a href="{url}" class="read-more-link">
            {read_more_title}
            <span class="arrow-icon">→</span>
        </a>
    </div>
</li>
